# Omarchium version pins. Bash-sourceable; every script reads this.
# `scripts/upgrade <version>` rewrites the CHROMIUM_* / ARCH_* lines for you.

# Upstream Chromium release we build on (stable channel).
CHROMIUM_VERSION=157.0.8103.78
CHROMIUM_SHA256=9fdce9d3c866f97f14f7a4250915e8e5b729dc952fcfb3a35507b126233f0660

# Arch Linux's chromium packaging (gitlab.archlinux.org/archlinux/packaging/packages/chromium)
# supplies the "build on a distro toolchain" patches. We pin the commit that
# matches CHROMIUM_VERSION; build-patches/ is a snapshot of it.
ARCH_PKG_REPO=https://gitlab.archlinux.org/archlinux/packaging/packages/chromium.git
ARCH_PKG_COMMIT=157.0.8103.78-1

# Crubit (Rust<->C++ bindings tool) must be built with the same rustc as the
# browser. Arch pins a known-good revision; we follow it.
CRUBIT_REPO=https://chromium.googlesource.com/external/github.com/google/crubit.git
CRUBIT_REV=25d2c01bde904c3333bb2d48201e5cbb186a1c7f

# rustup toolchain (needs the rustc-dev, rust-src, rustfmt and llvm-tools components).
RUST_TOOLCHAIN=1.99.1
